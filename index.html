<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Times Table Stars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a math notebook page. One column: score strip, problem card, chunky sticker keys. */
:root {
  --paper: #f4f8ff;
  --grid: #d5e2f7;
  --ink: #1b2a4e;
  --card: #ffffff;
  --muted: #5c6b8c;
  --marker: #ffc933;
  --accent: #2f6fed;
  --on-accent: #ffffff;
  --good: #1f9d62;
  --good-bg: #dff6e9;
  --miss: #d9482f;
  --miss-bg: #ffe6e0;
  --series-1: #2a78d6;
  --y1: #6e5200; --y2: #9a7400; --y3: #c99a00; --y4: #f2c200; --y5: #ffe033;
  --g1: #0f4d2e; --g2: #17703f; --g3: #25a45c; --g4: #3ecf7a; --g5: #7df0a6;
  --series-2: #eb6834;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Atkinson Hyperlegible", Verdana, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #121a30; --grid: #1e2a4a; --ink: #eef3ff; --card: #1b2644; --muted: #9eadcf;
    --marker: #ffc933; --accent: #6fa0ff; --on-accent: #0d1630;
    --good: #4fd693; --good-bg: #153a2b; --miss: #ff8a75; --miss-bg: #46201b;
    --series-1: #3987e5; --series-2: #d95926;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #121a30; --grid: #1e2a4a; --ink: #eef3ff; --card: #1b2644; --muted: #9eadcf;
  --marker: #ffc933; --accent: #6fa0ff; --on-accent: #0d1630;
  --good: #4fd693; --good-bg: #153a2b; --miss: #ff8a75; --miss-bg: #46201b;
    --series-1: #3987e5; --series-2: #d95926;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  overflow-y: auto;
}
.game {
  min-height: 100%;
  max-width: 440px;
  margin: 0 auto;
  padding: 14px 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Score strip */
.strip { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.level { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.1; }
.counts { display: flex; gap: 8px; }
.chip {
  font-family: var(--display); font-weight: 800; font-size: 18px;
  font-variant-numeric: tabular-nums;
  background: var(--card); border: 2px solid var(--ink); border-radius: 999px;
  padding: 2px 12px; white-space: nowrap;
}
.mute { cursor: pointer; color: var(--ink); line-height: inherit; }
.mute:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.mute[aria-pressed="true"] { background: var(--paper); border-style: dashed; }
.meter { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.meter-track {
  flex: 1; height: 14px; background: var(--card);
  border: 2px solid var(--ink); border-radius: 999px; overflow: hidden;
}
.meter-fill { height: 100%; width: 0; background: var(--marker); transition: width .35s ease; }

/* Problem card */
.card {
  position: relative;
  flex: 1 1 auto;
  min-height: 230px;
  background: var(--card);
  border: 3px solid var(--ink);
  border-radius: 22px;
  box-shadow: 0 6px 0 var(--ink);
  padding: 12px 14px 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  text-align: center;
  transition: background-color .15s, border-color .15s;
}
.card.right { background: var(--good-bg); border-color: var(--good); box-shadow: 0 6px 0 var(--good); }
.card.wrong { background: var(--miss-bg); border-color: var(--miss); box-shadow: 0 6px 0 var(--miss); }
.card.wrong .problem { animation: shake .35s; }

.timer { display: flex; gap: 6px; font-size: 26px; line-height: 1; min-height: 28px; }
.timer span { transition: opacity .4s, filter .4s, transform .4s; }
.timer span.gone { opacity: .22; filter: grayscale(1); transform: scale(.8); }
.timer.hidden { visibility: hidden; }

.problem {
  font-family: var(--display); font-weight: 800;
  font-size: clamp(46px, 15vw, 68px); line-height: 1.05;
  font-variant-numeric: tabular-nums;
  display: flex; align-items: center; justify-content: center; gap: .22em; flex-wrap: wrap;
}
.answer {
  min-width: 1.9em; padding: 0 .18em;
  border-bottom: 6px solid var(--accent);
  color: var(--accent);
  border-radius: 6px 6px 0 0;
}
.answer:empty::before { content: "?"; opacity: .35; }
.card.right .answer { color: var(--good); border-color: var(--good); }
.card.wrong .answer { color: var(--miss); border-color: var(--miss); text-decoration: line-through; }

.feedback { min-height: 78px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.big-emoji { font-size: 34px; line-height: 1; min-height: 36px; }
.big-emoji.pop { animation: pop .4s cubic-bezier(.3,1.6,.5,1); }
#question.pop { animation: pop .3s cubic-bezier(.3,1.6,.5,1); }
.msg { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.15; text-wrap: balance; }
.card.right .msg { color: var(--good); }
.card.wrong .msg { color: var(--miss); }
.sub { font-size: 15px; color: var(--muted); min-height: 19px; }

/* Keys */
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.key {
  font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1;
  color: var(--ink); background: var(--card);
  border: 3px solid var(--ink); border-radius: 16px;
  box-shadow: 0 4px 0 var(--ink);
  min-height: 54px; padding: 6px 0 2px;
  cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.key:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.key:disabled { opacity: .45; cursor: default; }
.key:focus-visible, .link:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.key.wide { grid-column: span 2; }
.key.go {
  grid-column: 1 / -1;
  background: var(--accent); color: var(--on-accent);
  font-size: 26px; min-height: 60px;
}
.foot { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.round-info { font-size: 15px; color: var(--muted); min-height: 19px; }

/* Player screen */
.home-title { font-family: var(--display); font-weight: 800; font-size: 38px; line-height: 1; margin: 18px 0 0; }
.home-sub { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 0; }
.notice {
  background: var(--card); border: 2px dashed var(--muted); border-radius: 12px;
  padding: 8px 12px; font-size: 15px;
}
.players { display: flex; flex-direction: column; gap: 12px; }
.player-row { display: flex; gap: 8px; align-items: stretch; }
.player {
  flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 24px; padding: 8px 16px 4px; text-align: left;
}
.player small { font-family: var(--body); font-weight: 400; font-size: 15px; color: var(--muted); }
.remove { font-size: 15px; font-family: var(--body); font-weight: 700; padding: 0 12px; min-width: 52px; color: var(--muted); }
.new-player { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.new-player label { font-family: var(--display); font-weight: 600; font-size: 20px; }
.new-row { display: flex; gap: 8px; }
.new-row input {
  flex: 1; min-width: 0; font: inherit; font-size: 20px; color: var(--ink); background: var(--card);
  border: 3px solid var(--ink); border-radius: 16px; padding: 10px 14px;
}
.new-row input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.new-row .key.go { grid-column: auto; padding: 6px 18px 2px; min-height: 54px; }
.link {
  background: none; border: 0; padding: 4px 8px; cursor: pointer;
  font: inherit; font-size: 14px; color: var(--muted); text-decoration: underline;
}

/* Report */
.report-title { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1.05; margin: 14px 0 0; text-wrap: balance; }
.report-line { margin: 0; font-size: 17px; }
.panel {
  background: var(--card); border: 3px solid var(--ink); border-radius: 18px;
  padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px;
}
.panel h2 { font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1.1; margin: 0; }
.panel h3 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 4px 0 0; }
.panel p { margin: 0; font-size: 15px; color: var(--muted); }
.panel p.strong { color: var(--ink); font-size: 16px; }
.cheer { background: var(--marker); color: #1b2a4e; border-color: #1b2a4e; text-align: center; }
.cheer h2 { font-size: 24px; }
.cheer p { color: #1b2a4e; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fact {
  font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.2;
  font-variant-numeric: tabular-nums; white-space: nowrap;
  border-radius: 999px; padding: 3px 11px 1px; border: 2px solid;
}
.fact.well { background: var(--good-bg); border-color: var(--good); }
.fact.work { background: var(--miss-bg); border-color: var(--miss); }
.fact.slow { background: var(--paper); border-color: var(--marker); }
.fact { white-space: normal; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--body); font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .end { fill: var(--ink); font-weight: 700; }
.chart .hit { fill: transparent; cursor: pointer; outline: none; }
.chart .hit:focus-visible { stroke: var(--accent); stroke-width: 2; }
.readout { font-size: 15px; min-height: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }
.numbers { font-size: 14px; color: var(--muted); }
.numbers summary { cursor: pointer; }
.numbers table { border-collapse: collapse; margin-top: 6px; width: 100%; font-variant-numeric: tabular-nums; }
.numbers th, .numbers td { text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--grid); }
.numbers th:first-child, .numbers td:first-child { text-align: left; }
.grid10 { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; font-variant-numeric: tabular-nums; }
.grid10 > * {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  font-size: 13px; border-radius: 6px; line-height: 1;
}
.grid10 .head { font-family: var(--display); font-weight: 800; color: var(--muted); }
.grid10 .cell { background: var(--paper); border: 1px solid var(--grid); color: var(--ink); }
.grid10 .cell { cursor: pointer; padding: 0; font: inherit; font-size: 13px; }
.grid10 .cell.y1 { background: var(--y1); border-color: var(--y1); color: #ffffff; }
.grid10 .cell.y2 { background: var(--y2); border-color: var(--y2); color: #ffffff; }
.grid10 .cell.y3 { background: var(--y3); border-color: var(--y3); color: #1b2a4e; }
.grid10 .cell.y4 { background: var(--y4); border-color: var(--y4); color: #1b2a4e; }
.grid10 .cell.y5 { background: var(--y5); border-color: var(--y5); color: #1b2a4e; }
.grid10 .cell.g1 { background: var(--g1); border-color: var(--g1); color: #ffffff; }
.grid10 .cell.g2 { background: var(--g2); border-color: var(--g2); color: #ffffff; }
.grid10 .cell.g3 { background: var(--g3); border-color: var(--g3); color: #1b2a4e; }
.grid10 .cell.g4 { background: var(--g4); border-color: var(--g4); color: #1b2a4e; }
.grid10 .cell.g5 { background: var(--g5); border-color: var(--g5); color: #1b2a4e; }
.grid10 .cell.y0 { background: var(--marker); border-color: var(--marker); color: #1b2a4e; }
.grid10 .cell.g0 { background: var(--good-bg); border-color: var(--good); }
.grid10 .cell.work { background: var(--miss-bg); border: 2px solid var(--miss); font-weight: 700; }
.grid10 .cell.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
.grid10 .cell:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.heat-key { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.heat-key i { width: 34px; height: 16px; border-radius: 4px; border: 1px solid var(--grid); display: inline-block; }
.bar { height: 12px; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
.bar div { height: 100%; background: var(--marker); }
.report-actions { display: flex; flex-direction: column; gap: 10px; align-items: center; padding-bottom: 12px; }
.report-actions .key.go { width: 100%; }
.cloud { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.report-btn { font-size: 20px; padding: 0 10px; min-width: 52px; }

/* Insane mode */
.mode {
  font-family: var(--display); font-weight: 800; font-size: 17px; line-height: 1.2;
  color: var(--ink); background: var(--card); border: 2px solid var(--ink); border-radius: 999px;
  padding: 5px 14px 3px; cursor: pointer;
}
.mode[aria-pressed="true"] { background: var(--miss); border-color: var(--miss); color: var(--card); }
.mode:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.problem.big { font-size: clamp(32px, 10.5vw, 48px); }
.feedback { gap: 6px; }
.fuse { width: 70%; height: 12px; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; background: var(--card); margin: 8px 0; }
.fuse i { display: block; height: 100%; width: 100%; background: var(--miss); }

/* Level-up burst */
.burst { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.burst span {
  position: absolute; left: 50%; top: 50%; font-size: 28px;
  animation: fly 1.3s ease-out forwards;
}
@keyframes fly {
  from { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
  to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(var(--rot)); opacity: 0; }
}
@keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
@media (prefers-reduced-motion: reduce) {
  .big-emoji.pop, #question.pop, .card.wrong .problem { animation: none; }
  .burst { display: none; }
  .meter-fill, .timer span { transition: none; }
}
@media (max-height: 640px) {
  .card { min-height: 200px; }
  .key { min-height: 46px; font-size: 24px; }
  .key.go { min-height: 52px; }
}
</style>
</head>
<body>
<main class="game" id="home">
  <h1 class="home-title">Times Table Stars ⭐</h1>
  <div class="notice" id="notice" hidden></div>
  <p class="home-sub" id="whoLabel">Who is playing?</p>
  <div class="players" id="players"></div>
  <form class="new-player" id="newForm" autocomplete="off">
    <label for="newName" id="newLabel">New player</label>
    <div class="new-row">
      <input id="newName" type="text" maxlength="18" placeholder="Type your name" autocapitalize="words" spellcheck="false">
      <button class="key go" type="submit" id="newGo">Start ▶</button>
    </div>
  </form>
  <p class="cloud" id="cloud"></p>
</main>

<main class="game" id="report" hidden>
  <div id="reportBody" style="display:flex;flex-direction:column;gap:12px"></div>
  <div class="report-actions">
    <button class="key go" type="button" id="againBtn">Play again ▶</button>
    <button class="mode" type="button" id="modeBtn2" aria-pressed="false">🔥 Insane mode: OFF</button>
    <button class="mode" type="button" id="bigBtn2" aria-pressed="false" hidden>🧮 3-digit mode: OFF</button>
    <button class="link" type="button" id="switchBtn">Switch player</button>
  </div>
</main>

<main class="game" id="play" hidden>
  <div class="strip">
    <div class="level" id="level">Level 1 · Sprout 🌱</div>
    <div class="counts">
      <div class="chip" id="stars" aria-label="Stars collected">⭐ 0</div>
      <div class="chip" id="streak" aria-label="Correct in a row">🔥 0</div>
      <button class="chip mute" type="button" id="musicBtn" aria-pressed="false" aria-label="Mute music">🔊</button>
    </div>
  </div>
  <div class="meter">
    <span>Next level</span>
    <div class="meter-track" role="progressbar" aria-label="Progress to next level" aria-valuemin="0" aria-valuemax="100" id="meterTrack">
      <div class="meter-fill" id="meterFill"></div>
    </div>
    <span id="nextEmoji">🧭</span>
  </div>

  <section class="card" id="card">
    <div class="round-info" id="roundInfo"></div>
    <div class="fuse" id="fuse" hidden aria-hidden="true"><i></i></div>
    <div class="timer hidden" id="timer" aria-hidden="true"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="problem" id="problem">
      <span id="question">Ready?</span>
      <span id="equals" hidden>=</span>
      <span class="answer" id="answer" hidden></span>
    </div>
    <div class="feedback" aria-live="polite">
      <div class="big-emoji" id="emoji">👋</div>
      <div class="msg" id="msg">Answer fast to win more stars!</div>
      <div class="sub" id="sub"></div>
      <button class="mode" type="button" id="modeBtn" aria-pressed="false" hidden>🔥 Insane mode: OFF</button>
      <button class="mode" type="button" id="bigBtn" aria-pressed="false" hidden>🧮 3-digit mode: OFF</button>
    </div>
    <div class="burst" id="burst" aria-hidden="true"></div>
  </section>

  <div class="pad" id="pad">
    <button class="key" type="button" data-k="1">1</button>
    <button class="key" type="button" data-k="2">2</button>
    <button class="key" type="button" data-k="3">3</button>
    <button class="key" type="button" data-k="4">4</button>
    <button class="key" type="button" data-k="5">5</button>
    <button class="key" type="button" data-k="6">6</button>
    <button class="key" type="button" data-k="7">7</button>
    <button class="key" type="button" data-k="8">8</button>
    <button class="key" type="button" data-k="9">9</button>
    <button class="key wide" type="button" data-k="0">0</button>
    <button class="key" type="button" data-k="back" aria-label="Erase">⌫</button>
    <button class="key go" type="button" id="go">Play ▶</button>
  </div>
  <div class="foot"><button class="link" type="button" id="stop">Stop round</button></div>
</main>

<script>
(function () {
  "use strict";

  // ---------- Game rules ----------
  // Levels with a table add that table. Levels without one are mix-up levels: everything so far, no new facts.
  var LEVELS = [
    { name: "Sprout",       emoji: "🌱", tables: [1] },
    { name: "Scout",        emoji: "🔦", tables: [10] },
    { name: "Explorer",     emoji: "🧭", tables: [2] },
    { name: "Camper",       emoji: "⛺", tables: [] },
    { name: "Hiker",        emoji: "🥾", tables: [5] },
    { name: "Ranger",       emoji: "🌲", tables: [] },
    { name: "Climber",      emoji: "🧗", tables: [3] },
    { name: "Skier",        emoji: "⛷️", tables: [] },
    { name: "Diver",        emoji: "🤿", tables: [4] },
    { name: "Sailor",       emoji: "⛵", tables: [] },
    { name: "Pilot",        emoji: "✈️", tables: [6] },
    { name: "Racer",        emoji: "🏎️", tables: [] },
    { name: "Captain",      emoji: "⚓", tables: [9] },
    { name: "Knight",       emoji: "🛡️", tables: [] },
    { name: "Astronaut",    emoji: "🚀", tables: [7] },
    { name: "Inventor",     emoji: "💡", tables: [] },
    { name: "Wizard",       emoji: "🧙", tables: [8] },
    { name: "Dragon Tamer", emoji: "🐉", tables: [] },
    { name: "Superhero",    emoji: "🦸", tables: [], tough: true }, // tough middle of the chart most
    { name: "Champion",     emoji: "🏅", tables: [], tough: true }
  ];
  // Where levels from earlier versions land in these 20.
  var FROM_5 = [4, 8, 12, 16, 19];
  var FROM_10 = [1, 2, 4, 6, 8, 10, 12, 14, 16, 19];

  var INSANE_MS = 5000; // insane mode: a right answer only counts within this time
  var BIG_FAST_MS = 20000, BIG_OK_MS = 40000, BIG_IDLE_MS = 120000; // 3-digit mode gets far more time
  var FAST_MS = 5000;   // 3 stars at or under this
  var OK_MS = 8000;     // 2 stars at or under this, 1 star after
  var METER_GOAL = 8;   // points needed to move up a level
  var STORE_KEY = "times-table-stars-v2";
  var CLOUD_ON = false; // account saving is built but switched off until asked for

      var ang = (Math.PI * 2 * i) / 16 + Math.random() * 0.4;
      var dist = 110 + Math.random() * 90;
      sp.textContent = bits[i % bits.length];
      sp.style.setProperty("--dx", Math.round(Math.cos(ang) * dist) + "px");
      sp.style.setProperty("--dy", Math.round(Math.sin(ang) * dist) + "px");
      sp.style.setProperty("--rot", Math.round(Math.random() * 360 - 180) + "deg");
      el.burst.appendChild(sp);
    }
    setTimeout(function () { el.burst.textContent = ""; }, 1500);
  }

  function press(k) {
    if (phase !== "ask") return;
    if (k === "back") typed = typed.slice(0, -1);
    else if (typed.length < (state.big ? 4 : 3)) typed = typed === "0" ? k : typed + k;
    el.answer.textContent = typed;
    el.go.disabled = typed === "";
  }
  function go() {
    if (phase === "ready" || phase === "report") startRound();
    else if (phase === "wrong" || phase === "cheer") { if (round.done) showReport(false); else ask(); }
    else if (phase === "ask") check();
  }

  el.pad.addEventListener("click", function (e) {
    var b = e.target.closest("[data-k]");
    if (b && !b.disabled) press(b.getAttribute("data-k"));
  });
  el.go.addEventListener("click", function () { go(); });
  document.addEventListener("keydown", function (e) {
    if (phase === "home" || e.metaKey || e.ctrlKey || e.altKey) return;
    bump();
    if (e.key >= "0" && e.key <= "9" && e.key.length === 1) { press(e.key); e.preventDefault(); }
    else if (e.key === "Backspace") { press("back"); e.preventDefault(); }
    else if (e.key === "Enter") { go(); e.preventDefault(); }
    else if ((e.key === "s" || e.key === "S") && (isPlaying() || phase === "count")) { el.stop.click(); e.preventDefault(); }
  });
  // Looking away mid-question should not count as being slow.
  document.addEventListener("visibilitychange", function () {
    if (music.ctx) { try { if (document.hidden) music.ctx.suspend(); else music.ctx.resume(); } catch (e) {} }
    if (document.hidden && phase === "ask") { untimed = true; timers.forEach(clearTimeout); timers = []; }
    // Insane mode cannot be timed fairly after looking away, so that question is swapped for a new one.
    else if (!document.hidden && phase === "ask" && untimed && state.insane) ask();
  });
  var STOP_LOCK_MS = 2000; // insane mode: no stopping once this little time is left on a question
  el.stop.addEventListener("click", function () {
    if (phase === "ask" && state.insane && !untimed && performance.now() - t0 >= INSANE_MS - STOP_LOCK_MS) {
      el.sub.textContent = "Too late to stop. Answer this one first!";
      return;
    }
    if (isPlaying() && round.n > 0) showReport(false);
    else showHome();
  });
  el.againBtn.addEventListener("click", startRound);
  el.switchBtn.addEventListener("click", function () { showHome(); });

  function start() {
    players = load();
    showHome();
    if (CLOUD_ON) connectCloud(); else cloud.state = "off";
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start();

  // Exposed for a quick logic check only.
  window.__tts = { pickFact: pickFact, grade: grade, freshState: freshState, LEVELS: LEVELS, learnedCount: learnedCount };
})();
</script>
